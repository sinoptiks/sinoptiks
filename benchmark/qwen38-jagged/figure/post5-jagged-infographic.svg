<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Cantarell, 'DejaVu Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101725"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="6" fill="#2ee6d6"/>

  <text x="40" y="56" font-size="34" font-weight="700" fill="#eef3fb">Directions survive. Magnitudes don't.</text>
  <text x="40" y="86" font-size="22" fill="#8ea0b8">Same model, same card, two mornings apart — every number moved, the shape held.</text>
  <text x="1560" y="42" font-size="16" fill="#5f7086" text-anchor="end">2026-11-26 · single RTX 3090 · personal lab</text>
  <text x="1560" y="62" font-size="16" fill="#5f7086" text-anchor="end">all numbers: live runs on the served model, not static analysis</text>

  <!-- ============ PANEL A: the gap itself moves ============ -->
  <rect x="40" y="106" width="740" height="330" rx="14" fill="#161f2e" stroke="#243044"/>
  <text x="64" y="138" font-size="17" font-weight="700" fill="#8ea0b8" letter-spacing="2">THE QUANT GAP ITSELF MOVES WITH THE ENGINE</text>
  <text x="64" y="162" font-size="15" fill="#5f7086">decode tok/s, same weights, same harness, two builds</text>
  <!-- group 0.1.63 -->
  <text x="185" y="404" font-size="15" fill="#8ea0b8" text-anchor="middle">engine 0.1.63</text>
  <rect x="110" y="253" width="70" height="140" fill="#2ee6d6"/>
  <text x="145" y="243" font-size="16" font-weight="700" fill="#eef3fb" text-anchor="middle">107.1</text>
  <rect x="200" y="269" width="70" height="124" fill="#9d8bff"/>
  <text x="235" y="259" font-size="16" font-weight="700" fill="#eef3fb" text-anchor="middle">94.8</text>
  <text x="190" y="205" font-size="18" font-weight="700" fill="#2ee6d6" text-anchor="middle">+13%</text>
  <!-- group 0.1.67 -->
  <text x="560" y="404" font-size="15" fill="#8ea0b8" text-anchor="middle">engine 0.1.67</text>
  <rect x="485" y="239" width="70" height="154" fill="#2ee6d6"/>
  <text x="520" y="229" font-size="16" font-weight="700" fill="#eef3fb" text-anchor="middle">117.5</text>
  <rect x="575" y="266" width="70" height="127" fill="#9d8bff"/>
  <text x="610" y="256" font-size="16" font-weight="700" fill="#eef3fb" text-anchor="middle">96.7</text>
  <text x="565" y="191" font-size="18" font-weight="700" fill="#2ee6d6" text-anchor="middle">+21.5%</text>
  <line x1="80" y1="393" x2="700" y2="393" stroke="#243044"/>
  <text x="660" y="138" font-size="14" fill="#5f7086" text-anchor="end">teal = IQ4_XS · violet = Q4_K_XL</text>
  <text x="64" y="425" font-size="15" fill="#e7b75f">There is no engine-free number for "how much faster is the better quant".</text>

  <!-- ============ PANEL B: the ladder flipped ============ -->
  <rect x="820" y="106" width="740" height="330" rx="14" fill="#161f2e" stroke="#243044"/>
  <text x="844" y="138" font-size="17" font-weight="700" fill="#8ea0b8" letter-spacing="2">THE "BETTER EDITOR" TOOTH FLIPPED</text>
  <text x="844" y="162" font-size="15" fill="#5f7086">truncated agentic edits, lower = better</text>
  <!-- old family -->
  <text x="844" y="205" font-size="15" fill="#8ea0b8">original task family</text>
  <rect x="1030" y="190" width="242" height="26" fill="#2ee6d6" opacity="0.55"/>
  <text x="1280" y="209" font-size="15" fill="#eef3fb">main 37</text>
  <rect x="1030" y="224" width="144" height="26" fill="#9d8bff"/>
  <text x="1182" y="243" font-size="15" fill="#eef3fb">aux 22 — aux wins</text>
  <!-- new family -->
  <text x="844" y="295" font-size="15" fill="#8ea0b8">new 8×5 family (0.1.67)</text>
  <rect x="1030" y="280" width="59" height="26" fill="#2ee6d6"/>
  <text x="1097" y="299" font-size="15" fill="#eef3fb">main 9 — main wins</text>
  <rect x="1030" y="314" width="111" height="26" fill="#9d8bff" opacity="0.55"/>
  <text x="1149" y="333" font-size="15" fill="#eef3fb">aux 17</text>
  <path d="M 900 258 L 900 276" stroke="#e7b75f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="915" y="272" font-size="15" font-weight="700" fill="#e7b75f">direction reversed</text>
  <text x="844" y="381" font-size="15" fill="#8ea0b8">exact-match successes nearly equal: 18 vs 19 of 40.</text>
  <text x="844" y="403" font-size="15" fill="#8ea0b8">Failure modes differ by quant: main writes wrong strings (13 vs 4),</text>
  <text x="844" y="423" font-size="15" fill="#8ea0b8">aux truncates. "Edit discipline" is a quant × task-family property.</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0,0 L8,0 L4,7 Z" fill="#e7b75f"/></marker></defs>

  <!-- ============ PANEL C: decision stable, surface drifts ============ -->
  <rect x="40" y="456" width="740" height="330" rx="14" fill="#161f2e" stroke="#243044"/>
  <text x="64" y="488" font-size="17" font-weight="700" fill="#8ea0b8" letter-spacing="2">SAFETY: DECISION STABLE, SURFACE DRIFTS</text>
  <text x="64" y="512" font-size="15" fill="#5f7086">refusals visible in content, budget 300, t=0, seed 2000 · two runs a day apart</text>
  <!-- axis -->
  <line x1="120" y1="720" x2="700" y2="720" stroke="#243044"/>
  <text x="100" y="725" font-size="14" fill="#5f7086" text-anchor="end">0</text>
  <text x="100" y="565" font-size="14" fill="#5f7086" text-anchor="end">8</text>
  <line x1="120" y1="560" x2="700" y2="560" stroke="#243044" stroke-dasharray="4 4"/>
  <!-- IQ4_XS row: 8 -> 8 -->
  <text x="140" y="596" font-size="15" fill="#8ea0b8">IQ4_XS</text>
  <circle cx="300" cy="560" r="9" fill="#2ee6d6"/>
  <circle cx="560" cy="560" r="9" fill="#2ee6d6"/>
  <line x1="309" y1="560" x2="551" y2="560" stroke="#2ee6d6" stroke-width="3"/>
  <text x="300" y="540" font-size="16" font-weight="700" fill="#2ee6d6" text-anchor="middle">8/8</text>
  <text x="560" y="540" font-size="16" font-weight="700" fill="#2ee6d6" text-anchor="middle">8/8</text>
  <!-- Q4_K_XL row: 6 -> 7 (scale: 8=560, 0=720, 20px/unit) -->
  <text x="140" y="676" font-size="15" fill="#8ea0b8">Q4_K_XL</text>
  <circle cx="300" cy="600" r="9" fill="#e7b75f"/>
  <circle cx="560" cy="580" r="9" fill="#e7b75f"/>
  <line x1="309" y1="596" x2="551" y2="584" stroke="#e7b75f" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="300" y="632" font-size="16" font-weight="700" fill="#e7b75f" text-anchor="middle">6/8</text>
  <text x="560" y="612" font-size="16" font-weight="700" fill="#e7b75f" text-anchor="middle">7/8</text>
  <text x="640" y="676" font-size="14" fill="#5f7086" text-anchor="end">run 1 → run 2</text>
  <text x="64" y="755" font-size="15" fill="#e7b75f">Same quant, same seed, same engine: the surface moved. Decision at budget 2048: 8/8 everywhere.</text>

  <!-- ============ PANEL D: token price of a visible refusal ============ -->
  <rect x="820" y="456" width="740" height="330" rx="14" fill="#161f2e" stroke="#243044"/>
  <text x="844" y="488" font-size="17" font-weight="700" fill="#8ea0b8" letter-spacing="2">A VISIBLE REFUSAL HAS A TOKEN PRICE</text>
  <text x="844" y="512" font-size="15" fill="#5f7086">budget sweep, main model, two harmful prompts, t=0 · y = visible content chars</text>
  <!-- axes -->
  <line x1="900" y1="720" x2="1530" y2="720" stroke="#243044"/>
  <text x="900" y="740" font-size="13" fill="#5f7086" text-anchor="middle">64</text>
  <text x="1048" y="740" font-size="13" fill="#5f7086" text-anchor="middle">192</text>
  <text x="1174" y="740" font-size="13" fill="#5f7086" text-anchor="middle">300</text>
  <text x="1290" y="740" font-size="13" fill="#5f7086" text-anchor="middle">400</text>
  <text x="1520" y="740" font-size="13" fill="#5f7086" text-anchor="middle">600 tok budget</text>
  <!-- cliff band -->
  <rect x="1048" y="530" width="75" height="190" fill="#e7b75f" opacity="0.12"/>
  <line x1="1085" y1="530" x2="1085" y2="720" stroke="#e7b75f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1085" y="522" font-size="15" font-weight="700" fill="#e7b75f" text-anchor="middle">price ≈ 250 tok</text>
  <!-- R6 teal -->
  <polyline points="900,720 974,720 1048,720 1123,708 1174,674 1290,543 1520,547" fill="none" stroke="#2ee6d6" stroke-width="3"/>
  <circle cx="900" cy="720" r="5" fill="#2ee6d6"/><circle cx="974" cy="720" r="5" fill="#2ee6d6"/><circle cx="1048" cy="720" r="5" fill="#2ee6d6"/>
  <circle cx="1123" cy="708" r="5" fill="#2ee6d6"/><circle cx="1174" cy="674" r="5" fill="#2ee6d6"/><circle cx="1290" cy="543" r="5" fill="#2ee6d6"/><circle cx="1520" cy="547" r="5" fill="#2ee6d6"/>
  <!-- R7 violet -->
  <polyline points="900,720 974,720 1048,720 1123,690 1174,637 1290,565 1520,548" fill="none" stroke="#9d8bff" stroke-width="3"/>
  <circle cx="1123" cy="690" r="5" fill="#9d8bff"/><circle cx="1174" cy="637" r="5" fill="#9d8bff"/><circle cx="1290" cy="565" r="5" fill="#9d8bff"/><circle cx="1520" cy="548" r="5" fill="#9d8bff"/>
  <text x="1450" y="530" font-size="14" fill="#2ee6d6">brake prompt</text>
  <text x="1450" y="585" font-size="14" fill="#9d8bff">forgery prompt</text>
  <text x="912" y="700" font-size="14" fill="#e7b75f">zero visible content</text>
  <text x="844" y="770" font-size="15" fill="#8ea0b8">Reasoning eats the budget until it saturates (~1200 chars); the refusal appears only after its price is paid.</text>

  <!-- ============ conclusion cards ============ -->
  <rect x="40" y="806" width="740" height="118" rx="14" fill="#161f2e" stroke="#2ee6d6" stroke-opacity="0.5"/>
  <text x="64" y="836" font-size="16" font-weight="700" fill="#2ee6d6" letter-spacing="2">WHAT SURVIVES AS A CLAIM</text>
  <text x="64" y="864" font-size="16" fill="#eef3fb">Directions, orderings inside one build, and the safety decision itself.</text>
  <text x="64" y="890" font-size="16" fill="#eef3fb">The text never repeats — the verdicts do: 8/8 refusals, everywhere, every run.</text>

  <rect x="820" y="806" width="740" height="118" rx="14" fill="#161f2e" stroke="#e7b75f" stroke-opacity="0.5"/>
  <text x="844" y="836" font-size="16" font-weight="700" fill="#e7b75f" letter-spacing="2">WHAT MOVED IN 9 MINUTES</text>
  <text x="844" y="864" font-size="16" fill="#eef3fb">Quant gap +13% → +21.5% · ladder direction flipped · surface 6/8 → 7/8.</text>
  <text x="844" y="890" font-size="16" fill="#eef3fb">5/5 different texts at t=0, same seed — and half my "wrong edits" were near-misses.</text>

  <!-- footer -->
  <text x="40" y="955" font-size="15" fill="#5f7086">Limits, visible: single draws per cell · one card, one model family · probe n=18 · ladder is one run per family.</text>
  <text x="40" y="978" font-size="15" fill="#5f7086">Artifacts: benchmark/qwen38-jagged/{engine-drift, quant-shelf, jagged-probe, suite-20261126}/ — raw logs, kit, scripts.</text>
</svg>
